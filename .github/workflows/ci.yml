name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: haatlink
          POSTGRES_PASSWORD: haatlink
          POSTGRES_DB: haatlink
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U haatlink -d haatlink"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://haatlink:haatlink@localhost:5432/haatlink?schema=public
      DIRECT_URL: postgresql://haatlink:haatlink@localhost:5432/haatlink?schema=public
      SESSION_SECRET: ci-session-secret-must-be-32-chars-min
      ADMIN_PIN: "654321"
      REDIS_URL: redis://localhost:6379
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: true
